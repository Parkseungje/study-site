# AI 에게 개념을 써달라고 할 때 쓰는 프롬프트.
# /prompt 화면에서 {{변수}} 가 치환된 전문을 복사하거나 내려받는다.
#
# 이 커리큘럼의 척추는 "고통 → 해결" 이다.
# 정의로 시작하는 글은 안 된다. 그전에 뭐가 불편했는지로 시작한다.

- id: add-concept
  name: 개념 새로 쓰기
  body: |
    {{title}} 개념을 study-site 의 content 규격에 맞는 마크다운 파일 하나로 써줘.
    설명 문장 없이 파일 내용만. 본문은 전부 한국어. 평서체("~다")로.

    ## 가장 중요한 것: 고통 → 해결 서사

    이 기술이 왜 나왔는지, 그전에는 뭐가 불편했는지부터 쓴다.
    "X는 Y다" 같은 정의로 시작하면 안 된다.

    고통은 반드시 실제로 돌아가는 코드로 보여준다. 말로 "불편했다" 하지 말고,
    독자가 그 코드를 보고 "아 이거 짜증나겠네" 하게 만든다.

    중간 단계를 건너뛰지 마라. 대개 이렇게 흘러간다:
      로우레벨(고통) → 사람들이 피해본 방법(부족했음) → 지금의 해결책 → 새 고통

    ## 난이도로 나누지 않는다

    한 개념이 한 페이지다. 입문/중급/심화로 쪼개지 않는다. 길어도 괜찮다.
    대신 ## 절로 충분히 나눠 목차로 따라갈 수 있게 한다.

    ## 파일 형식

    - 이 개념이 들어갈 장: {{chapterId}}
    - 파일명은 {{conceptId}}.md 가 된다
    - 프런트매터: title, summary(한 문장), versionNote, ord, minutes(숫자 하나)
    - edges 는 prerequisite / deepens / related 중 해당되는 것만

    ## 본문 구조

    프런트매터 바로 뒤에 도입 두세 문단. 이 글이 어떤 고통을 따라가는지 알린다.
    그다음 아래 절을 이 순서로. 제목은 내용에 맞게 바꿔도 된다.

      ## 0. 들어가기 전에 — 핵심 용어
         용어 5개 안팎을 불릿으로. 각각에 짧은 비유를 붙인다.
         "한 줄 그림:" 으로 전체를 한 문장에 담고,
         전체를 관통하는 비유 하나를 한 문단으로 푼다.
      ## 1. 그전엔 어떻게 했나 — <고통의 이름>
         실제 코드로 보여준다. "### 고통 1/2/3" 으로 나눠 구체적으로.
         마지막에 세 고통이 사실 하나의 원인임을 짚는다.
      ## 2. 이렇게 피해봤다 — <중간 시도>
         사람들이 어떻게든 피해본 방법들을 "### 시도 1/2/3" 으로.
         각각 어디까지 되고 어디서 부족했는지. 실제 사례를 든다.
      ## 3. 그래서 나온 것
         해결책. 1번의 고통들과 표로 일대일 대응시킨다.
      ## 4. 어떻게 동작하나
         내부 동작. 여기에 visual 블록을 하나 둔다.
         "그래서 이런 사실이 따라 나온다" 까지 밀고 간다.
      ## 5. 이것도 끝이 아니다 — 다음 고통
         이 해결책이 못 푸는 것. 어느 개념으로 이어지는지 [[링크]]로 건다.
      ## 자기 점검
         답이 바로 안 나오는 질문 4~5개.
      ## 덧 — 흔한 오해
         흔한 오해 2~3개를 bad/good 코드로 바로잡는다.
         역사적 배경이나 "이걸 쓰지 말아야 할 때"도 여기. 없으면 생략.

    ## 시각 자료를 아끼지 마라

    한 글에 visual 블록을 **3개 이상** 넣는다. 종류도 섞는다.
    긴 설명이 나올 때마다 "이건 그림이 빠르지 않나"를 묻고, 그렇다면 그림으로 바꾼다.

      "A 하고 나서 B 하고 C 한다"        → kind: step
      "클라이언트가 보내면 서버가 응답"    → kind: sequence
      "안에 뭐가 들어 있고 그 안에 또"     → kind: structure
      "이 설정이면 이렇게, 저러면 저렇게"  → kind: playground

    특히 이 자리들은 거의 항상 그림이 낫다:
    - "1. 그전엔 어떻게 했나" 의 고통이 여러 단계를 거칠 때 → step
    - "4. 어떻게 동작하나" → 반드시 하나. step 이나 sequence
    - 설정값·옵션에 따라 동작이 갈릴 때 → playground
    - 계층이나 포함 관계를 말로 풀고 있을 때 → structure

    playground 는 임의 코드를 실행하지 않는다. 조건과 결과를 표로 선언한다.
    when 의 조건이 많이 맞는 것이 뽑히므로, 공통 조건은 짧게 적으면 된다.

    네 종류의 정확한 YAML 형식은 아래 content 규격에 있다. 그대로 따른다.

    ## 분량

    본문 전체 10KB 이상. 얕으면 다시 써라.
    표로 때우지 말고 문장으로 설명한다. 표는 대응 관계를 보일 때만.

    ## 표기 규칙

    - 다른 개념은 [[conceptId]] 로. 아래 목록에 있는 id 만
    - 코드 펜스에 file= 을 붙이고, 비교는 bad/good 쌍으로
    - 비교 블록 안 코드는 한 줄 60자 이내
    - 영문 뒤 조사는 붙여 쓴다 ("Spring Boot는", "Spring Boot 는" 아님)
    이미 쓴 개념 id: {{existingIds}}

- id: edit-concept
  name: 기존 개념 고치기
  body: |
    아래는 study-site 의 {{conceptId}}.md 파일이다.
    요청한 부분만 고치고, 고친 파일 전문을 그대로 내놔줘. 설명 문장은 붙이지 말 것.

    지켜야 할 것:
    - 고통 → 해결 서사를 깨지 말 것. 정의로 시작하는 문장으로 바꾸지 마라
    - 난이도로 쪼개지 말 것. 한 페이지로 둔다
    - 프런트매터의 chapterId 는 바꾸지 말 것
    - 절 제목을 바꾸면 목차 앵커가 바뀐다. 꼭 필요할 때만
    - 제목이 같은 절을 두 개 만들지 말 것
    - [[링크]] 는 아래 목록에 있는 id 만
    - versionNote 를 함께 갱신할 것

    이미 쓴 개념 id: {{existingIds}}

    고칠 내용: (여기에 적기)

    ---

    (여기에 기존 .md 전문 붙여넣기)

- id: deepen-concept
  name: 얕은 부분 보강
  body: |
    아래 study-site 개념 문서를 읽고, 얕은 곳을 찾아 보강해줘.
    전문을 다시 내놓되 기존 문장은 되도록 살리고 덧붙이는 쪽으로.

    특히 이것들을 본다:
    - 고통이 말로만 있고 코드로 없는가
    - 중간 시도 단계가 통째로 빠졌는가
    - 표로 눌러놓고 설명을 안 한 곳이 있는가
    - "왜 이렇게 됐는지" 없이 "이렇게 한다"만 있는 곳
    - 다음 고통으로 이어지는 마무리가 없는가
    - 자기 점검 질문이 너무 쉬운가
    - **긴 설명인데 그림이 없는 곳** — visual 블록으로 바꾼다

    본문이 10KB 미만이면 반드시 늘린다.
    visual 이 3개 미만이면 반드시 늘린다. 종류도 섞는다
    (step / sequence / structure / playground).

    ---

    (여기에 기존 .md 전문 붙여넣기)

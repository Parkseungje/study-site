# AI 에게 개념을 써달라고 할 때 쓰는 프롬프트.
# /prompt 화면에서 {{변수}} 가 치환된 전문을 복사하거나 내려받는다.

- id: add-concept
  name: 개념 새로 쓰기
  body: |
    {{title}} 개념을 study-site 의 content 규격에 맞는 마크다운 파일 하나로 써줘.
    설명 문장 없이 파일 내용만. 본문은 전부 한국어.

    - 이 개념이 들어갈 장: {{chapterId}}
    - 파일명은 {{conceptId}}.md 가 된다
    - 프런트매터: title, summary(한 문장), versionNote(기준 버전), ord, minutes
    - edges 는 prerequisite / deepens / related 중 해당되는 것만
    - "# intro" 전제 지식 0 기준, 5분, 절 나누지 않음
    - "# standard" 20분, "##" 절 5개 이상
    - "# deep" 내부 동작과 엣지 케이스. 쓸 깊이가 없으면 생략
    - 절 제목은 그대로 목차가 되니 내용을 드러내게 쓸 것
    - 다른 개념은 [[conceptId]] 로 표기. 아래 목록에 있는 id 만 쓸 것
    - 코드 펜스에 file= 을 붙이고, 비교는 bad/good 쌍으로
    - 비교 블록 안 코드는 한 줄 60자 이내
    - 그림이 설명보다 빠른 곳은 ```visual 펜스에 YAML 로 낼 것

    이미 쓴 개념 id: {{existingIds}}

- id: edit-concept
  name: 기존 개념 고치기
  body: |
    아래는 study-site 의 {{conceptId}}.md 파일이다.
    요청한 부분만 고치고, 고친 파일 전문을 그대로 내놔줘. 설명 문장은 붙이지 말 것.

    지켜야 할 것:
    - 프런트매터의 id 성격(파일명)과 chapterId 는 바꾸지 말 것
    - 절 제목을 바꾸면 목차 앵커가 바뀐다. 꼭 필요할 때만
    - 같은 난이도 안에 제목이 같은 절을 두 개 만들지 말 것
    - [[링크]] 는 아래 목록에 있는 id 만
    - versionNote 를 함께 갱신할 것

    이미 쓴 개념 id: {{existingIds}}

    고칠 내용: (여기에 적기)

    ---

    (여기에 기존 .md 전문 붙여넣기)

- id: add-visual
  name: 시각 자료만 추가
  body: |
    아래 개념 본문에서 그림이 설명보다 빠른 자리를 찾아,
    그 자리에 넣을 ```visual 펜스를 만들어줘. 본문은 바꾸지 말고
    "어느 절 뒤에 넣을지 + visual 블록" 만 내놔줘.

    - kind 는 step | sequence | structure | playground 중 하나
    - id 는 {{conceptId}}- 로 시작할 것
    - playground 는 임의 코드가 아니라 inputs/outcomes 표로 선언할 것

    ---

    (여기에 기존 .md 전문 붙여넣기)

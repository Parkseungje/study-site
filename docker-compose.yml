services:
  db:
    image: mysql:8
    container_name: study-site-db
    restart: unless-stopped
    # 한글 본문과 이모지가 깨지지 않도록 utf8mb4 로 고정한다
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: study
      MYSQL_USER: study
      MYSQL_PASSWORD: study
      MYSQL_ROOT_PASSWORD: root
    ports:
      # 호스트에 이미 MySQL 이 3306 을 쓰고 있어 3307 로 내보낸다
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ustudy", "-pstudy"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
